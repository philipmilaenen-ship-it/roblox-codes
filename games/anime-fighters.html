<!DOCTYPE html>

    <title>Anime Fighters - Codes Roblox</title>

    <link rel="stylesheet" href="../style.css">

    <style>

        .codes-list {
            display: grid;
            gap: 15px;
            margin-top: 30px;
        }

        .code {
            background: #13161d;
            border: 1px solid #252a34;
            border-radius: 12px;
            padding: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-name {
            color: #00ff88;
            font-weight: bold;
            font-size: 18px;
        }

        .reward {
            color: #888;
            margin-top: 5px;
        }

        .copy {
            background: #00ff88;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .copy:hover {
            transform: scale(1.05);
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #00ff88;
            text-decoration: none;
        }

    </style>

</head>
