<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RIVALS - RobloxCodes</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .codes-list {
            display: grid;
            gap: 15px;
            margin-top: 30px;
        }

        .code {
            background: #13161d;
            border: 1px solid #252a34;
            border-radius: 12px;
            padding: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-name {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .code-name {
            color: #00ff88;
            font-weight: bold;
            font-size: 18px;
        }

        .reward {
            color: #888;
            margin-top: 5px;
        }

        .status {
            color: #00ff88;
            font-size: 13px;
            margin-top: 8px;
        }

        .copy {
            background: #00ff88;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .copy:hover {
            transform: scale(1.05);
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #00ff88;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        Roblox<span>Codes</span>
    </div>

    <div>
        <a href="../index.html">Accueil</a>
        <a href="../index.html#games">Jeux</a>
        <a href="../codes.html">Codes actifs</a>
    </div>

</nav>


<main class="container">

    <a class="back" href="../index.html">
        ← Retour
    </a>

    <h1>🎮 RIVALS</h1>

    <p style="color:#888; margin-top:10px;">
        Codes actuellement listés comme actifs.
    </p>


    <div class="codes-list">


        <!-- COCONUTBONK -->

        <div class="code">

            <div>

                <div class="game-name">
                    🎮 RIVALS
                </div>

                <div class="code-name">
                    COCONUTBONK
                </div>

                <div class="reward">
                    🥥 250 Pearls
                </div>

                <div class="status">
                    🟢 Actif
                </div>

            </div>

            <button
                class="copy"
                onclick="copyCode('COCONUTBONK')">

                Copier

            </button>

        </div>


        <!-- RIVALSSUMMER -->

        <div class="code">

            <div>

                <div class="game-name">
                    🎮 RIVALS
                </div>

                <div class="code-name">
                    RIVALSSUMMER
                </div>

                <div class="reward">
                    🎁 3 Tropical Chests
                </div>

                <div class="status">
                    🟢 Actif
                </div>

            </div>

            <button
                class="copy"
                onclick="copyCode('RIVALSSUMMER')">

                Copier

            </button>

        </div>


    </div>

</main>


<footer>
    © 2026 RobloxCodes
</footer>


<script>

function copyCode(code) {

    navigator.clipboard.writeText(code);

    alert("Code copié : " + code);

}

</script>

</body>

</html>
